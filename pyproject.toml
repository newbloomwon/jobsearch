[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Framework-agnostic job aggregation + resume-matching engine with a thin HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
# Thin HTTP layer (FastAPI). The engine itself never imports these.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
# Resume file parsing (PDF / DOCX) in the engine's resume module.
resume = [
    "pypdf>=4.0",
    "python-docx>=1.1.0",
]
# Scraped providers (LinkedIn / Indeed / Glassdoor / ZipRecruiter) via OSS JobSpy.
scrapers = [
    "python-jobspy>=1.1.60",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch_engine", "src/jobsearch_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
