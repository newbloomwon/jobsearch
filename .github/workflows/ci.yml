name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # scrapers extra is intentionally excluded: the suite never hits the
        # network, and it verifies the graceful "not configured" path too.
        run: pip install -e ".[api,resume,dev]"
      - name: Test
        run: pytest -q
